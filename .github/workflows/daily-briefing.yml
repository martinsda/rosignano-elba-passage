name: Daily Passage Briefing — Rosignano ↔ Portoferraio

on:
  schedule:
    - cron: '0 5 * * *'    # 05:00 UTC = 07:00 local (CEST verão) / 06:00 (CET inverno)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate briefing
        run: node scripts/generate-briefing.js
        env:
          WINDY_API_KEY: ${{ secrets.WINDY_API_KEY }}
          SMTP_HOST:     ${{ secrets.SMTP_HOST }}
          SMTP_PORT:     ${{ secrets.SMTP_PORT }}
          SMTP_USER:     ${{ secrets.SMTP_USER }}
          SMTP_PASS:     ${{ secrets.SMTP_PASS }}
          EMAIL_TO:      ${{ secrets.EMAIL_TO }}

      - name: Pull latest before commit
        run: git pull --rebase origin main

      - name: Commit generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "briefing: auto-generated ${{ github.run_id }}"
          file_pattern: "output/*.md index.html"
          commit_user_name: "Passage Bot"
          commit_user_email: "actions@github.com"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
